# VerbalForge AI Server Configuration

# Runner Intervals (in hours)
runner_intervals:
  tc_runner: 2.0       # Text Completion every 2 hours
  se_runner: 2.0       # Sentence Equivalence every 2 hours
  rc_runner: 3.0       # Reading Comprehension every 3 hours

# Question Generation Configuration
question_config:
  text_completion:
    easy: 0
    medium: 3
    hard: 3
  
  sentence_equivalence:
    easy: 0
    medium: 2
    hard: 3
  
  reading_comprehension:
    easy: 0
    medium: 1
    hard: 1
    questions_per_passage: 4

# Logging Configuration
logging:
  level: INFO
  file: logs/verbalforge.log

# Timeout Settings (in seconds)
timeouts:
  question_generation: 180    # 3 minutes for TC/SE questions
  passage_generation: 300     # 5 minutes for RC passages